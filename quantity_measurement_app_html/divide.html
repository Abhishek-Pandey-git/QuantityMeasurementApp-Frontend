<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divide Quantities - QuantityMeasurementApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding-bottom: 40px; }
        .navbar { background-color: rgba(255, 255, 255, 0.95); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .navbar-right { display: flex; gap: 10px; }
        .btn-nav { padding: 8px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .back-btn { background-color: #6b7280; color: white; }
        .back-btn:hover { background-color: #4b5563; }
        .logout-btn { background-color: #dc2626; color: white; }
        .logout-btn:hover { background-color: #b91c1c; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }
        h1 { color: #1f2937; font-size: 28px; margin-bottom: 8px; font-weight: 700; }
        .description { color: #6b7280; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; color: #374151; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; transition: all 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .section { background-color: #f7fafb; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .section h3 { color: #1f2937; font-size: 16px; margin-bottom: 16px; font-weight: 700; }
        .btn-group { display: flex; gap: 12px; margin-top: 32px; }
        .btn { flex: 1; padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .result-box { background: #f0fdf4; border: 2px solid #86efac; border-radius: 12px; padding: 24px; margin-top: 24px; display: none; }
        .result-box.show { display: block; }
        .result-title { color: #15803d; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .result-content { color: #166534; font-size: 14px; line-height: 1.8; }
        .error-box { background: #fef2f2; border: 2px solid #fca5a5; border-radius: 12px; padding: 24px; margin-top: 24px; display: none; color: #991b1b; }
        .error-box.show { display: block; }
        .loading { display: none; text-align: center; color: #667eea; font-weight: 600; padding: 20px; }
        .loading.show { display: block; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand" onclick="goBack()">⚡ QuantityMeasurement</div>
        <div class="navbar-right">
            <button class="btn-nav back-btn" onclick="goBack()">← Back</button>
            <button class="btn-nav logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>÷ Divide Quantities</h1>
            <p class="description">Divide one quantity by another</p>

            <form id="divideForm" onsubmit="handleDivide(event)">
                <div class="section">
                    <h3>First Quantity</h3>
                    <div class="form-group">
                        <label for="value1">Value</label>
                        <input type="number" id="value1" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="unit1">Unit</label>
                        <select id="unit1" required></select>
                    </div>
                </div>

                <div class="section">
                    <h3>Second Quantity</h3>
                    <div class="form-group">
                        <label for="value2">Value</label>
                        <input type="number" id="value2" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="unit2">Unit</label>
                        <select id="unit2" required></select>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">✨ Divide</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
            </form>

            <div class="loading" id="loading">⏳ Dividing...</div>
            <div class="result-box" id="resultBox">
                <div class="result-title">✅ Result</div>
                <div class="result-content" id="resultContent"></div>
            </div>
            <div class="error-box" id="errorBox"></div>
        </div>
    </div>

    <script>
        const UNITS = { LengthUnit: ['FEET', 'INCHES', 'YARDS', 'CENTIMETERS'], VolumeUnit: ['LITER', 'MILLILITER', 'GALLON'], WeightUnit: ['KILOGRAM', 'GRAM', 'POUND'], TemperatureUnit: ['CELSIUS', 'FAHRENHEIT'] };

        window.addEventListener('load', function() {
            if (!localStorage.getItem('accessToken')) window.location.href = 'index.html';
            const type = localStorage.getItem('selectedMeasurementType');
            if (!type) { window.location.href = 'dashboard.html'; return; }

            const units = UNITS[type];
            [document.getElementById('unit1'), document.getElementById('unit2')].forEach(select => {
                units.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u;
                    opt.textContent = u;
                    select.appendChild(opt);
                });
            });
        });

        function goBack() { window.location.href = 'operations.html'; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function showError(msg) { const e = document.getElementById('errorBox'); e.textContent = msg; e.classList.add('show'); }
        function clearError() { document.getElementById('errorBox').classList.remove('show'); }

        async function handleDivide(event) {
            event.preventDefault();
            clearError();

            const v1 = parseFloat(document.getElementById('value1').value);
            const u1 = document.getElementById('unit1').value;
            const v2 = parseFloat(document.getElementById('value2').value);
            const u2 = document.getElementById('unit2').value;
            const type = localStorage.getItem('selectedMeasurementType');

            if (v2 === 0) {
                showError('❌ Cannot divide by zero');
                return;
            }

            const payload = {
                thisQuantityDTO: { value: v1, unit: u1, measurementType: type },
                thatQuantityDTO: { value: v2, unit: u2, measurementType: type }
            };

            try {
                document.getElementById('loading').classList.add('show');
                const token = localStorage.getItem('accessToken');
                const response = await fetch('http://localhost:8080/api/v1/quantities/divide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                document.getElementById('loading').classList.remove('show');

                if (!response.ok) {
                    const error = await response.json();
                    showError(`❌ ${error.message || 'Failed'}`);
                    return;
                }

                const result = await response.json();
                document.getElementById('resultContent').innerHTML = `<strong>${v1} ${u1} ÷ ${v2} ${u2} = ${result.resultValue} ${result.resultUnit}</strong>`;
                document.getElementById('resultBox').classList.add('show');
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                showError(`❌ ${error.message}`);
            }
        }
    </script>
</body>
</html>
