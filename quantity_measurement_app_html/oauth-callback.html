<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing OAuth Login...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
        }

        .error-message {
            background-color: #fee2e2;
            color: #992626;
            border: 1px solid #fecaca;
            padding: 16px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        .retry-btn.show {
            display: inline-block;
        }

        .retry-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1>Processing Login...</h1>
        <p>Please wait while we authenticate your Google account.</p>

        <div class="error-message" id="errorMessage">
            <strong>Error:</strong> <span id="errorText"></span>
        </div>

        <button class="retry-btn" id="retryBtn" onclick="window.location.href='index.html'">
            Return to Login
        </button>
    </div>

    <script>
        window.addEventListener('load', function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const accessToken = urlParams.get('accessToken');
            const refreshToken = urlParams.get('refreshToken');
            const email = urlParams.get('email');
            const error = urlParams.get('error');

            // If there's an error
            if (error) {
                showError(error);
                return;
            }

            // If tokens are present
            if (accessToken && refreshToken) {
                // Store tokens in localStorage
                localStorage.setItem('accessToken', accessToken);
                localStorage.setItem('refreshToken', refreshToken);
                localStorage.setItem('email', email);
                localStorage.setItem('provider', 'Google');

                console.log('OAuth2 Login Successful');
                console.log('Email:', email);

                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                // No tokens and no error - shouldn't happen
                showError('No authentication tokens received. Please try again.');
            }
        });

        function showError(errorMessage) {
            // Hide spinner
            document.getElementById('spinner').style.display = 'none';

            // Show error message
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('errorText').textContent = decodeURIComponent(errorMessage);

            // Show retry button
            document.getElementById('retryBtn').classList.add('show');

            // Update title and heading
            document.querySelector('h1').textContent = 'Login Failed';
            document.querySelector('p').textContent = 'Something went wrong during the authentication process.';

            console.error('OAuth2 Error:', errorMessage);
        }
    </script>
</body>
</html>
